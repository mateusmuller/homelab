---
- name: Install Uptime Kuma on Raspberry Pi ARMv6
  hosts: uptime_kuma
  become: true

  vars:
    node_version: 20.17.0
    node_archive: "node-v{{ node_version }}-linux-armv6l.tar.xz"
    node_url: "https://unofficial-builds.nodejs.org/download/release/v{{ node_version }}/{{ node_archive }}"
    node_checksum: d21c0836b193f96b25a427e6a0a8077dad6634b596689d071d0618ef69f4ba6a
    uptime_kuma_version: 2.5.5
    uptime_kuma_dir: /opt/uptime-kuma

  handlers:
    - name: Restart Uptime Kuma
      ansible.builtin.systemd:
        name: uptime-kuma
        state: restarted
        daemon_reload: true

  tasks:
    - name: Verify this is the ARMv6 Raspberry Pi
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_architecture == "armv6l"
        fail_msg: >-
          This playbook is intended for Debian/Raspbian on ARMv6;
          detected {{ ansible_distribution }} {{ ansible_distribution_version }}
          on {{ ansible_architecture }}.

    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - acl
          - build-essential
          - ca-certificates
          - curl
          - git
          - libsqlite3-dev
          - python3
          - xz-utils
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Check installed Node version
      ansible.builtin.command: /usr/local/bin/node --version
      register: installed_node
      changed_when: false
      failed_when: false

    - name: Download ARMv6 Node build
      ansible.builtin.get_url:
        url: "{{ node_url }}"
        dest: "/tmp/{{ node_archive }}"
        checksum: "sha256:{{ node_checksum }}"
        mode: "0644"
      when: installed_node.stdout != "v" ~ node_version

    - name: Install ARMv6 Node build
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_archive }}"
        dest: /usr/local
        remote_src: true
        extra_opts:
          - --strip-components=1
      when: installed_node.stdout != "v" ~ node_version

    - name: Create Uptime Kuma user
      ansible.builtin.user:
        name: uptime-kuma
        system: true
        home: "{{ uptime_kuma_dir }}"
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create Uptime Kuma directory
      ansible.builtin.file:
        path: "{{ uptime_kuma_dir }}"
        state: directory
        owner: uptime-kuma
        group: uptime-kuma
        mode: "0755"

    - name: Download Uptime Kuma
      become_user: uptime-kuma
      ansible.builtin.git:
        repo: https://github.com/louislam/uptime-kuma.git
        dest: "{{ uptime_kuma_dir }}"
        version: "{{ uptime_kuma_version }}"
        depth: 1
        update: false

    - name: Install ARMv6-compatible dependencies
      become_user: uptime-kuma
      ansible.builtin.shell: |
        set -eu
        npm install --omit=dev --no-audit --fetch-timeout=600000 --fetch-retries=5
        rm -rf node_modules/@louislam/sqlite3
        npm pkg delete dependencies.@louislam/sqlite3
        npm install sqlite3@5.1.7 --build-from-source --omit=dev --no-audit --fetch-timeout=600000 --fetch-retries=5
        touch .armv6-dependencies-{{ uptime_kuma_version }}
      args:
        chdir: "{{ uptime_kuma_dir }}"
        creates: "{{ uptime_kuma_dir }}/.armv6-dependencies-{{ uptime_kuma_version }}"
        executable: /bin/bash
      environment:
        PATH: /usr/local/bin:/usr/bin:/bin
        NODE_OPTIONS: --max-old-space-size=256 --experimental-require-module
      notify: Restart Uptime Kuma

    - name: Use source-built SQLite driver
      ansible.builtin.replace:
        path: "{{ uptime_kuma_dir }}/server/database.js"
        regexp: 'require\("@louislam/sqlite3"\)'
        replace: 'require("sqlite3")'
      notify: Restart Uptime Kuma

    - name: Download Uptime Kuma web interface
      become_user: uptime-kuma
      ansible.builtin.command:
        cmd: /usr/local/bin/npm run download-dist
        chdir: "{{ uptime_kuma_dir }}"
        creates: "{{ uptime_kuma_dir }}/dist/index.html"
      environment:
        PATH: /usr/local/bin:/usr/bin:/bin
        NODE_OPTIONS: --max-old-space-size=256 --experimental-require-module
      notify: Restart Uptime Kuma

    - name: Install Uptime Kuma systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/uptime-kuma.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Uptime Kuma
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=uptime-kuma
          Group=uptime-kuma
          WorkingDirectory={{ uptime_kuma_dir }}
          Environment=NODE_ENV=production
          Environment="NODE_OPTIONS=--max-old-space-size=256 --experimental-require-module"
          Environment=UPTIME_KUMA_HOST=0.0.0.0
          Environment=UPTIME_KUMA_PORT=80
          Environment=UPTIME_KUMA_SQLITE_SINGLE_CONNECTION=true
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          ExecStart=/usr/local/bin/node {{ uptime_kuma_dir }}/server/server.js
          Restart=on-failure
          RestartSec=5
          KillSignal=SIGINT
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
      notify: Restart Uptime Kuma

    - name: Enable and start Uptime Kuma
      ansible.builtin.systemd:
        name: uptime-kuma
        state: started
        enabled: true
        daemon_reload: true

    - name: Apply pending restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for Uptime Kuma
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
      register: uptime_kuma_health
      retries: 30
      delay: 5
      until: uptime_kuma_health.status == 200
